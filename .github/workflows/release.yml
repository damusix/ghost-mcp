name: Release

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    id-token: write
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@v4

            # No `version:` — pnpm is resolved from the `packageManager` field
            # in package.json (pinned to pnpm@10.33.0). Setting both conflicts.
            - uses: pnpm/action-setup@v4

            - uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: '24'
                  cache: true

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            # Workaround: setup-node injects a fake NODE_AUTH_TOKEN placeholder
            # that prevents npm OIDC trusted publishing from activating.
            # See: https://github.com/actions/setup-node/issues/1440
            - name: Enable OIDC publishing
              run: npm config delete //registry.npmjs.org/:_authToken

            - run: pnpm install --frozen-lockfile
            - run: vp pack

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@v1
              with:
                  publish: pnpm exec changeset publish
                  title: 'chore: version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ''

            # The README links to releases/latest/download/ghost-writing.skill;
            # that URL only resolves if every release carries the asset. A .skill
            # is a zip with the skill folder at the archive root.
            - name: Package ghost-writing skill
              if: steps.changesets.outputs.published == 'true'
              working-directory: skills
              run: zip -r ../ghost-writing.skill ghost-writing

            - name: Attach skill to release
              if: steps.changesets.outputs.published == 'true'
              env:
                  PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
              run: gh release upload "v$(jq -r '.[0].version' <<< "$PUBLISHED")" ghost-writing.skill --clobber
