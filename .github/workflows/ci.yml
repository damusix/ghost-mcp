name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - uses: pnpm/action-setup@v4
              with:
                  version: latest

            - run: pnpm install --frozen-lockfile

            - name: Install Vite+
              run: |
                curl -fsSL https://vite.plus | bash
                grep -i "vp\|vite" $HOME/.bashrc $HOME/.profile 2>/dev/null || true
                find $HOME -name "vp" -o -name "vite-plus" 2>/dev/null | head -20
                cat $HOME/.bashrc | tail -10

            - run: |
                source $HOME/.bashrc
                which vp && vp check

            - run: vp test

            - run: vp pack
