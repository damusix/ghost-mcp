name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - uses: pnpm/action-setup@v4
              with:
                  version: latest

            - run: pnpm install --frozen-lockfile

            - name: Install Vite+
              run: |
                curl -fsSL https://vite.plus | bash
                echo "$HOME/.local/bin" >> $GITHUB_PATH
                echo "$HOME/.vp/bin" >> $GITHUB_PATH
                ls -la $HOME/.local/bin/vp $HOME/.vp/bin/vp 2>/dev/null || true
                find $HOME -name vp -type f 2>/dev/null || true

            - run: which vp && vp --version && vp check

            - run: vp test

            - run: vp pack
